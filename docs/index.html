<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>오류 증상 보고</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8a8a);
    --link: var(--tg-theme-link-color, #2678b6);
    --button: var(--tg-theme-button-color, #2678b6);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #f2f2f5);
    --danger: #d64545;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    padding: 20px 16px 96px;
    -webkit-text-size-adjust: 100%;
  }
  h1 { font-size: 1.25rem; margin-bottom: 20px; }
  .field { margin-bottom: 22px; }
  label { display: block; font-size: 0.9rem; margin-bottom: 6px; color: var(--text); }
  input[type="text"], input[type="datetime-local"], textarea {
    width: 100%;
    font-size: 1rem;
    color: var(--text);
    background: var(--secondary-bg);
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 12px;
    outline: none;
    font-family: inherit;
  }
  input:focus, textarea:focus { border-color: var(--button); }
  textarea { height: 110px; resize: none; }

  /* 이름 자동완성 */
  .autocomplete { position: relative; }
  #suggestions {
    position: absolute;
    left: 0; right: 0; top: calc(100% + 4px);
    background: var(--bg);
    border: 1px solid var(--secondary-bg);
    border-radius: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    max-height: 216px;
    overflow-y: auto;
    z-index: 10;
    display: none;
  }
  #suggestions button {
    display: block;
    width: 100%;
    text-align: left;
    font-size: 1rem;
    font-family: inherit;
    color: var(--text);
    background: none;
    border: none;
    padding: 12px;
    cursor: pointer;
  }
  #suggestions button:active { background: var(--secondary-bg); }

  .hint { font-size: 0.8rem; color: var(--hint); margin-top: 5px; }
  .hint.error { color: var(--danger); }
  .counter { text-align: right; font-size: 0.8rem; color: var(--hint); margin-top: 5px; }
  .counter.limit { color: var(--danger); }

  /* 텔레그램 밖(일반 브라우저)에서 테스트할 때만 보이는 대체 제출 버튼 */
  #fallbackSubmit {
    display: none;
    width: 100%;
    font-size: 1.05rem;
    font-family: inherit;
    color: var(--button-text);
    background: var(--button);
    border: none;
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
  }
  #fallbackSubmit:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <h1>오류 증상 보고</h1>

  <div class="field autocomplete">
    <label for="nameInput">이름</label>
    <input type="text" id="nameInput" placeholder="이름을 입력하세요"
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <div id="suggestions"></div>
    <div class="hint" id="nameHint"></div>
  </div>

  <div class="field">
    <label for="timeInput">언제 겪은 증상인가요?</label>
    <input type="datetime-local" id="timeInput">
    <div class="hint" id="timeHint"></div>
  </div>

  <div class="field">
    <label for="textInput">어떤 증상을 겪었는지 알려주세요.</label>
    <textarea id="textInput" maxlength="200" placeholder="예: 앱이 갑자기 멈추고 흰 화면만 보였어요"></textarea>
    <div class="counter" id="counter">0/200</div>
  </div>

  <button id="fallbackSubmit" disabled>제출</button>

<script>
(function () {
  "use strict";

  // ⚠️ 자리표시자 이름 86명 — 실제 명단은 names.py 를 수정한 뒤
  //    `python tools/sync_names.py` 로 이 배열을 자동 갱신하세요.
  // NAMES-START
  var NAMES = [
    "강민지", "강세영", "강애리", "강혜선", "구혜진", "권대헌", "권예진", "김경웅", "김기성", "김민섭",
    "김민종", "김상태", "김선영", "김성희", "김소영", "김소정", "김소현", "김수휘", "김승석", "김양모",
    "김용태", "김원경", "김원중", "김윤성", "김정면", "김정민", "김정현", "김지우", "김지혜", "김진우",
    "김진혁", "김형달", "김희섭", "도현진", "류희경", "목진수", "박규석", "박문수", "박영복", "박정요",
    "박지혜", "박진곤", "박채연", "박현철", "서미서", "성해동", "신원우", "안성훈", "안혜정", "양주희",
    "오윤석", "원공재", "유수원", "윤혜림", "이동곤", "이동원", "이병희", "이정근", "이정미", "이정민",
    "이진모", "이창조", "이혜경", "이호경", "이호현", "임상호", "임정욱", "임준우", "정국희", "정미소",
    "정승민", "정정곤", "조세영", "조수희", "진호진", "최상훈", "최소영", "최운", "최혜경", "추현진",
    "하슬비", "하헌진", "한건희", "한형우", "허혜진", "홍수민", "황성희"
  ];
  // NAMES-END

  var tg = window.Telegram && window.Telegram.WebApp;
  var inTelegram = !!(tg && tg.initData);
  if (tg) { tg.ready(); tg.expand(); }

  var nameInput = document.getElementById("nameInput");
  var suggestions = document.getElementById("suggestions");
  var nameHint = document.getElementById("nameHint");
  var timeInput = document.getElementById("timeInput");
  var timeHint = document.getElementById("timeHint");
  var textInput = document.getElementById("textInput");
  var counter = document.getElementById("counter");
  var fallbackSubmit = document.getElementById("fallbackSubmit");

  var selectedName = null; // 후보를 탭(또는 정확히 일치)해야 확정

  // ── 증상 시각: 현재 시각 디폴트, max = 현재 시각 (미래 불가, 과거 무제한)
  function nowLocal() {
    var d = new Date();
    function p(n) { return String(n).padStart(2, "0"); }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
           "T" + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  var maxTime = nowLocal();
  timeInput.value = maxTime;
  timeInput.max = maxTime;

  // ── 이름 자동완성: 전방 일치 우선, 부분 포함 차선
  function filterNames(query) {
    var starts = [], contains = [];
    for (var i = 0; i < NAMES.length; i++) {
      var n = NAMES[i];
      if (n.indexOf(query) === 0) starts.push(n);
      else if (n.indexOf(query) > 0) contains.push(n);
    }
    return starts.concat(contains);
  }

  function hideSuggestions() {
    suggestions.style.display = "none";
    suggestions.innerHTML = "";
  }

  function renderSuggestions(list) {
    suggestions.innerHTML = "";
    if (list.length === 0) { hideSuggestions(); return; }
    list.forEach(function (name) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = name;
      // click 대신 pointerdown: input blur보다 먼저 실행되도록
      btn.addEventListener("pointerdown", function (e) {
        e.preventDefault();
        selectName(name);
      });
      suggestions.appendChild(btn);
    });
    suggestions.style.display = "block";
  }

  function selectName(name) {
    selectedName = name;
    nameInput.value = name;
    hideSuggestions();
    updateValidity();
  }

  nameInput.addEventListener("input", function () {
    var q = nameInput.value.trim();
    selectedName = null;
    if (q === "") {
      hideSuggestions(); // 빈 입력 시 전체 목록 노출 방지
    } else {
      var matches = filterNames(q);
      // 입력이 목록의 이름과 정확히 일치하면 자동 확정
      if (matches.length > 0 && NAMES.indexOf(q) !== -1) {
        selectedName = q;
        hideSuggestions();
      } else {
        renderSuggestions(matches);
      }
    }
    updateValidity();
  });

  nameInput.addEventListener("blur", function () {
    // pointerdown 처리 이후 닫히도록 약간 지연
    setTimeout(hideSuggestions, 150);
  });

  // ── 글자수 카운터
  textInput.addEventListener("input", function () {
    var len = textInput.value.length;
    counter.textContent = len + "/200";
    counter.className = "counter" + (len >= 200 ? " limit" : "");
    updateValidity();
  });

  timeInput.addEventListener("input", updateValidity);
  timeInput.addEventListener("change", updateValidity);

  // ── 검증 게이팅: 세 항목 모두 유효할 때만 제출 활성화
  function validate() {
    var errors = { name: "", time: "" };
    var q = nameInput.value.trim();
    if (q !== "" && selectedName === null) errors.name = "목록에서 선택해 주세요";

    var timeOk = false;
    if (timeInput.value) {
      if (timeInput.value > maxTime) errors.time = "미래 시각은 선택할 수 없습니다";
      else timeOk = true;
    }

    var textOk = textInput.value.trim().length > 0 && textInput.value.length <= 200;
    return { valid: selectedName !== null && timeOk && textOk, errors: errors };
  }

  function updateValidity() {
    var v = validate();
    nameHint.textContent = v.errors.name;
    nameHint.className = "hint" + (v.errors.name ? " error" : "");
    timeHint.textContent = v.errors.time;
    timeHint.className = "hint" + (v.errors.time ? " error" : "");

    if (inTelegram) {
      if (v.valid) tg.MainButton.enable();
      else tg.MainButton.disable();
      tg.MainButton.setParams({ is_active: v.valid });
    } else {
      fallbackSubmit.disabled = !v.valid;
    }
  }

  // ── 제출
  function submit() {
    var v = validate();
    if (!v.valid) return;
    var payload = JSON.stringify({
      name: selectedName,
      symptom_time: timeInput.value.replace("T", " "), // YYYY-MM-DD HH:MM
      symptom_text: textInput.value.trim()
    });
    if (inTelegram) {
      tg.sendData(payload); // 폼이 닫히고 데이터가 봇에 전달됨
    } else {
      alert("전송 데이터 (브라우저 테스트 모드):\n" + payload);
    }
  }

  if (inTelegram) {
    tg.MainButton.setText("제출");
    tg.MainButton.show();
    tg.MainButton.disable();
    tg.onEvent("mainButtonClicked", submit);
  } else {
    fallbackSubmit.style.display = "block";
    fallbackSubmit.addEventListener("click", submit);
  }

  updateValidity();
})();
</script>
</body>
</html>
